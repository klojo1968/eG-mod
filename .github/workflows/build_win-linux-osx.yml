# 2024 Legacy team
name: ETLBuildWInLinOSX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * FRI"
permissions:
  contents: write

jobs:
  # Try to figure out the build version information only once
  pre-build:
    runs-on: ubuntu-latest
    outputs:
      describe: ${{ steps.git.outputs.describe }}
      tag: ${{ steps.git.outputs.tag }}
      uid: ${{ steps.git.outputs.uid }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch git version information
        id: git
        run: |
          git fetch --tags --force
          git_describe=$(git describe --abbrev=7 2>/dev/null | awk '{$1=$1};1')
          git_tag=$(git describe --abbrev=0 2>/dev/null | awk '{$1=$1};1')
          ci_id=$(uuidgen)
          echo "Version info: $git_describe ?? $git_tag"
          {
            echo "describe=$git_describe"
            echo "tag=$git_tag"
            echo "uid=$ci_id"
          } >> "$GITHUB_OUTPUT"

  # Compile the Vulkan renderer's GLSL shaders to SPIR-V once for all client
  # builds: SPIR-V doesn't depend on the platform, and the build
  # machines (containers, Windows) have no GLSL compiler. The build jobs embed
  # these files through VK_SHADER_PREBUILT_DIR.

  #   __  __               _                                                  _     _
  #  |  \/  |             | |                                                | |   (_)
  #  | \  / |   ___     __| |     __ _    ___   _ __     ___   _ __    __ _  | |_   _    ___    _ __
  #  | |\/| |  / _ \   / _` |    / _` |  / _ \ | '_ \   / _ \ | '__|  / _` | | __| | |  / _ \  | '_ \
  #  | |  | | | (_) | | (_| |   | (_| | |  __/ | | | | |  __/ | |    | (_| | | |_  | | | (_) | | | | |
  #  |_|  |_|  \___/   \__,_|    \__, |  \___| |_| |_|  \___| |_|     \__,_|  \__| |_|  \___/  |_| |_|
  #                               __/ |
  #                              |___/
  lnx64-mod:
    runs-on: ubuntu-latest
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{needs.pre-build.outputs.describe}} -e CI_ETL_TAG=${{needs.pre-build.outputs.tag}} -e CI_ETL_UID=${{needs.pre-build.outputs.uid}}
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -64 -mod

      - uses: actions/upload-artifact@v7
        with:
          name: lnx64-mod
          path: |
            build/eGmod/cgame*.so
            build/eGmod/ui*.so
            build/eGmod/qagame*.so
            build/eGmod/tvgame*.so
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: incomplete-mod-pk3
          path: build/eGmod/legacy_*.pk3
          if-no-files-found: error

  lnx32-mod:
    runs-on: ubuntu-latest
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{needs.pre-build.outputs.describe}} -e CI_ETL_TAG=${{needs.pre-build.outputs.tag}} -e CI_ETL_UID=${{needs.pre-build.outputs.uid}} -e CI=true
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -mod

      - uses: actions/upload-artifact@v7
        with:
          name: lnx32-mod
          path: |
            build/eGmod/cgame*.so
            build/eGmod/ui*.so
            build/eGmod/qagame*.so
            build/eGmod/tvgame*.so
          if-no-files-found: error
  
  lnx-aarch64-mod:
    runs-on: ubuntu-24.04
    needs: pre-build
    container:
      image: etlegacy/lnx-aarch64-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./easybuild.sh build -RPIT -mod -ninja

      - uses: actions/upload-artifact@v7
        with:
          name: lnx-aarch64-mod
          path: |
            build/eGmod/cgame*.so
            build/eGmod/ui*.so
            build/eGmod/qagame*.so
            build/eGmod/tvgame*.so
          if-no-files-found: error

  osx-mod:
    runs-on: macos-15
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies
        run: brew bundle

      - name: List dev tools
        run: |
          # shellcheck disable=SC2010
          ls -la /Applications/ | grep Xcode
          ls -la /Library/Developer/CommandLineTools/SDKs/
          xcode-select --print-path
          xcrun -sdk macosx --show-sdk-path

      - name: Build
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        shell: bash
        run: |
          ./easybuild.sh build -64 -mod --osx=10.10 --osx-arc="x86_64;arm64" -j

      - uses: actions/upload-artifact@v7
        with:
          name: osx-mod
          path: |
            build/eGmod/cgame_mac
            build/eGmod/ui_mac
            build/eGmod/qagame_mac
            build/eGmod/tvgame_mac
          if-no-files-found: error

  win-mod:
    runs-on: windows-2022
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod

      - uses: actions/upload-artifact@v7
        with:
          name: win-mod
          path: |
            build/eGmod/cgame*.dll
            build/eGmod/ui*.dll
            build/eGmod/qagame*.dll
            build/eGmod/tvgame*.dll
          if-no-files-found: error

  win64-mod:
    runs-on: windows-2022
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod -64

      - uses: actions/upload-artifact@v7
        with:
          name: win64-mod
          path: |
            build/eGmod/cgame*.dll
            build/eGmod/ui*.dll
            build/eGmod/qagame*.dll
            build/eGmod/tvgame*.dll
          if-no-files-found: error

  #   __  __                                                          _
  #  |  \/  |                                                        | |
  #  | \  / |   ___   _ __    __ _    ___     _ __ ___     ___     __| |  ___
  #  | |\/| |  / _ \ | '__|  / _` |  / _ \   | '_ ` _ \   / _ \   / _` | / __|
  #  | |  | | |  __/ | |    | (_| | |  __/   | | | | | | | (_) | | (_| | \__ \
  #  |_|  |_|  \___| |_|     \__, |  \___|   |_| |_| |_|  \___/   \__,_| |___/
  #                           __/ |
  #                          |___/
  # Since lnx32 is installing the most, use it as the step that combines all the other steps mod files.
  # This step also generates the final packages for 32 bit lnx.
  mod-merger:
    runs-on: ubuntu-latest
    needs:
      [
        pre-build,
        lnx64-mod,
        lnx32-mod,
        osx-mod,
        win-mod,
        win64-mod,
        lnx-aarch64-mod,
        ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: incomplete-mod-pk3

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-mod"
          path: platforms
          merge-multiple: true

      - name: Create supported platform manifest
        shell: bash
        run: |
          echo "win_x86 win_x86_64 lnx_x86 lnx_x86_64 macos_x86_64 macos_aarch64" > platforms.manifest

      - name: Merge mod files
        shell: bash
        run: |
          zip -rvj -MM legacy_*.pk3 platforms.manifest platforms/cgame* platforms/ui*

      - name: Create mod zip
        shell: bash
        run: |
          zip -rvj -MM etlegacy-mod-${{needs.pre-build.outputs.describe}}.zip legacy_*.pk3 platforms/qagame* platforms/tvgame*

      - name: Remove old artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: |
            incomplete-mod-pk3
            *-mod

      - uses: actions/upload-artifact@v7
        with:
          name: All-mods
          path: legacy_*.pk3
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mod-zip
          path: etlegacy-mod-*.zip
          if-no-files-found: error

  upload:
    runs-on: ubuntu-latest
    needs: [pre-build, mod-merger]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ needs.pre-build.outputs.describe }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/mod-zip/*
 
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [upload]
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: |
            All-mods
            mod-zip
            incomplete-mod-pk3
            *-mod
           
