# 2024 Legacy team
name: ETLBuildWIn

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * FRI"
permissions:
  contents: write

jobs:
  # Try to figure out the build version information only once
  pre-build:
    runs-on: ubuntu-latest
    outputs:
      describe: ${{ steps.git.outputs.describe }}
      tag: ${{ steps.git.outputs.tag }}
      uid: ${{ steps.git.outputs.uid }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch git version information
        id: git
        run: |
          git fetch --tags --force
          git_describe=$(git describe --abbrev=7 2>/dev/null | awk '{$1=$1};1')
          git_tag=$(git describe --abbrev=0 2>/dev/null | awk '{$1=$1};1')
          ci_id=$(uuidgen)
          echo "Version info: $git_describe ?? $git_tag"
          {
            echo "describe=$git_describe"
            echo "tag=$git_tag"
            echo "uid=$ci_id"
          } >> "$GITHUB_OUTPUT"

  # Compile the Vulkan renderer's GLSL shaders to SPIR-V once for all client
  # builds: SPIR-V doesn't depend on the platform, and the build
  # machines (containers, Windows) have no GLSL compiler. The build jobs embed
  # these files through VK_SHADER_PREBUILT_DIR.
  vk-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the GLSL compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Compile the shaders
        run: cmake -DVK_GLSL_COMPILER=glslc -DOUT_DIR=vk-shaders -P cmake/ETLCompileVkShaders.cmake

      - uses: actions/upload-artifact@v7
        with:
          name: vk-shaders
          path: vk-shaders/*.spv
          if-no-files-found: error

  #   __  __               _                                                  _     _
  #  |  \/  |             | |                                                | |   (_)
  #  | \  / |   ___     __| |     __ _    ___   _ __     ___   _ __    __ _  | |_   _    ___    _ __
  #  | |\/| |  / _ \   / _` |    / _` |  / _ \ | '_ \   / _ \ | '__|  / _` | | __| | |  / _ \  | '_ \
  #  | |  | | | (_) | | (_| |   | (_| | |  __/ | | | | |  __/ | |    | (_| | | |_  | | | (_) | | | | |
  #  |_|  |_|  \___/   \__,_|    \__, |  \___| |_| |_|  \___| |_|     \__,_|  \__| |_|  \___/  |_| |_|
  #                               __/ |
  #                              |___/
  win-mod:
    runs-on: windows-2022
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod

      - uses: actions/upload-artifact@v7
        with:
          name: win-mod
          path: |
            build/legacy/cgame*.dll
            build/legacy/ui*.dll
            build/legacy/qagame*.dll
            build/legacy/tvgame*.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: incomplete-mod-pk3
          path: build/legacy/legacy_*.pk3
          if-no-files-found: error


  win64-mod:
    runs-on: windows-2022
    needs: pre-build
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod -64

      - uses: actions/upload-artifact@v7
        with:
          name: win64-mod
          path: |
            build/legacy/cgame*.dll
            build/legacy/ui*.dll
            build/legacy/qagame*.dll
            build/legacy/tvgame*.dll
          if-no-files-found: error

  #   __  __                                                          _
  #  |  \/  |                                                        | |
  #  | \  / |   ___   _ __    __ _    ___     _ __ ___     ___     __| |  ___
  #  | |\/| |  / _ \ | '__|  / _` |  / _ \   | '_ ` _ \   / _ \   / _` | / __|
  #  | |  | | |  __/ | |    | (_| | |  __/   | | | | | | | (_) | | (_| | \__ \
  #  |_|  |_|  \___| |_|     \__, |  \___|   |_| |_| |_|  \___/   \__,_| |___/
  #                           __/ |
  #                          |___/
  # Since lnx32 is installing the most, use it as the step that combines all the other steps mod files.
  # This step also generates the final packages for 32 bit lnx.
  mod-merger:
    runs-on: ubuntu-latest
    needs:
      [
        pre-build,
        win-mod,
        win64-mod,
        ]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: incomplete-mod-pk3

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-mod"
          path: platforms
          merge-multiple: true

      - name: Create supported platform manifest
        shell: bash
        run: |
          echo "win_x86 win_x86_64" > platforms.manifest

      - name: Merge mod files
        shell: bash
        run: |
          zip -rvj -MM legacy_*.pk3 platforms.manifest platforms/cgame* platforms/ui*

      - name: Create mod zip
        shell: bash
        run: |
          zip -rvj -MM etlegacy-mod-${{needs.pre-build.outputs.describe}}.zip legacy_*.pk3 platforms/qagame* platforms/tvgame*

      - name: Remove old artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: |
            incomplete-mod-pk3
            *-mod

      - uses: actions/upload-artifact@v7
        with:
          name: All-mods
          path: legacy_*.pk3
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: mod-zip
          path: etlegacy-mod-*.zip
          if-no-files-found: error

  #   ______   _                   _                            _
  #  |  ____| (_)                 | |                          | |
  #  | |__     _   _ __     __ _  | |    _ __     __ _    ___  | | __   __ _    __ _    ___   ___
  #  |  __|   | | | '_ \   / _` | | |   | '_ \   / _` |  / __| | |/ /  / _` |  / _` |  / _ \ / __|
  #  | |      | | | | | | | (_| | | |   | |_) | | (_| | | (__  |   <  | (_| | | (_| | |  __/ \__ \
  #  |_|      |_| |_| |_|  \__,_| |_|   | .__/   \__,_|  \___| |_|\_\  \__,_|  \__, |  \___| |___/
  #                                     | |                                     __/ |
  #                                     |_|                                    |___/
  # Generate the final packages Windows
  win:
    runs-on: windows-2022
    needs: [pre-build, mod-merger, vk-shaders]
    env:
      CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
      CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
      CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
      VK_SHADER_PREBUILT_DIR: vk-shaders
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download the Vulkan shaders
        uses: actions/download-artifact@v8
        with:
          name: vk-shaders
          path: vk-shaders

      - name: Build
        shell: cmd
        run: |
          call .\easybuild.bat build -vk

      - uses: actions/download-artifact@v8
        with:
          name: All-mods
          path: build/legacy

      - name: Display structure of downloaded files
        run: dir
        working-directory: build/legacy

      - name: Upload Win etl.exe
        uses: actions/upload-artifact@v7
        id: artifact-exe-upload-step
        with:
          name: win-exe
          path: |
            build/etl.exe
          if-no-files-found: error

      - name: Generate packages
        shell: cmd
        working-directory: build
        run: |
          copy etl.exe .
          cpack

      - uses: actions/upload-artifact@v7
        with:
          name: win-packages
          path: |
            build/etlegacy-*.exe
            build/etlegacy-*.zip
          if-no-files-found: error

  win64:
    runs-on: windows-2022
    needs: [pre-build, mod-merger, vk-shaders]
    env:
      CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
      CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
      CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
      VK_SHADER_PREBUILT_DIR: vk-shaders
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download the Vulkan shaders
        uses: actions/download-artifact@v8
        with:
          name: vk-shaders
          path: vk-shaders

      - name: Build
        shell: cmd
        run: |
          call .\easybuild.bat build -64 -vk

      - uses: actions/download-artifact@v8
        with:
          name: All-mods
          path: build/legacy

      - name: Display structure of downloaded files
        run: dir
        working-directory: build/legacy

      - name: Upload Win64 etl.exe
        uses: actions/upload-artifact@v7
        id: artifact-exe-upload-step
        with:
          name: win64-exe
          path: |
            build/etl.exe
          if-no-files-found: error

      - name: Generate packages
        shell: cmd
        working-directory: build
        run: |
          copy etl.exe .
          cpack

      - uses: actions/upload-artifact@v7
        with:
          name: win64-packages
          path: |
            build/etlegacy-*.exe
            build/etlegacy-*.zip
          if-no-files-found: error
  
  upload:
    runs-on: ubuntu-latest
    needs: [pre-build, win, win64]
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ needs.pre-build.outputs.describe }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/lnx64-packages/*
            packages/lnx32-packages/*
            packages/win-packages/*
            packages/win64-packages/*
            packages/mod-zip/*
 
  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: [upload]
    steps:
      - uses: geekyeggo/delete-artifact@v6
        with:
          failOnError: false
          name: |
            All-mods
            mod-zip
            incomplete-mod-pk3
            *-packages
            *-mod
            *-exe

  ci-discord-notify-on-failure:
    needs:
      - pre-build
      - win-mod
      - win64-mod
      - mod-merger
      - win
      - win64
      - upload
      - cleanup
    if: |
      github.ref == 'refs/heads/master' &&
      failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.LEGACY_CI_WEBHOOK }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEVS_ROLE_ID: "260752921698762752"
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          MESSAGE="❌ ETLBuild **[failed on commit](<${RUN_URL}>)** \`${COMMIT_SHA}\` <@&${DEVS_ROLE_ID}>"

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"$MESSAGE\", \"allowed_mentions\": {\"roles\": [\"$DEVS_ROLE_ID\"]}}" \
               "$DISCORD_WEBHOOK"
